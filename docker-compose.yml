services:
  postgres:
    image: postgres:16-alpine
    container_name: loresabi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: loresabi
      POSTGRES_PASSWORD: loresabi
      POSTGRES_DB: loresabi
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loresabi -d loresabi"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: loresabi-api
    command: npm run dev -w @loresabi/api
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://loresabi:loresabi@postgres:5432/loresabi
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: loresabi-web
    command: npm run dev -w @loresabi/web
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules

volumes:
  postgres-data:
